<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Settings</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <h1 id="title">설정</h1>

      <label class="row">
        <span id="langLabel"></span>
        <select id="lang"></select>
      </label>

      <label class="row">
        <span id="themeLabel"></span>
        <select id="theme"></select>
      </label>

      <label class="row">
        <span id="intervalLabel"></span>
        <select id="interval"></select>
      </label>

      <label class="row">
        <span id="showPetLabel"></span>
        <input type="checkbox" id="showPet" />
      </label>
      <p id="showPetHelp" class="help"></p>

      <label class="row">
        <span id="followLabel"></span>
        <input type="checkbox" id="followCursor" />
      </label>
      <p id="followHelp" class="help"></p>

      <h2 id="gearTitle"></h2>
      <div id="gear"></div>

      <h2 id="packsTitle"></h2>
      <div id="packs"></div>
      <p id="packDrop" class="help"></p>
      <div class="actions">
        <span id="packStatus" class="status"></span>
        <button id="packImport" type="button"></button>
      </div>

      <label class="row">
        <span id="baseLabel"></span>
        <select id="base"></select>
      </label>

      <p id="note" class="note"></p>

      <hr />

      <section class="feedback">
        <h2 id="feedbackTitle"></h2>
        <textarea id="fbMessage" rows="4"></textarea>
        <input type="email" id="fbEmail" />
        <p id="fbSends" class="help"></p>
        <div class="actions">
          <span id="fbStatus" class="status"></span>
          <button id="fbSend" type="button"></button>
        </div>
      </section>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
