<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기지개햄 데모</title>
    <link rel="stylesheet" href="app/theme.css" />
    <link rel="stylesheet" href="demo.css" />
    <!-- 앱은 브라우저 언어를 따라가고, 한국어가 아니면 영어로 떨어진다.
         데모는 한국어로 고정한다. iframe이 뜨기 전에 정해야 하므로 head에 둔다.
         ?lang=en 으로 영어도 볼 수 있다. -->
    <script>
      const demoLang = new URLSearchParams(location.search).get('lang');
      localStorage.setItem('lang', demoLang === 'en' ? 'en' : 'ko');
      // 테마도 고정한다. 앱 기본값은 '시스템 따름'이라, 보는 사람이 다크 모드면
      // 데모 페이지만 밝고 그 안의 창들은 까맣게 나와 따로 논다.
      localStorage.setItem('theme', 'light');
    </script>
  </head>
  <body>
    <header>
      <h1>기지개햄 <span>데모</span></h1>
      <p class="what">20분마다 햄스터가 와서 같이 눈운동하고 기지개 켜는 맥 앱이에요.</p>
      <p id="note">설치 없이 여기서 바로 해볼 수 있어요. 화면 안에서 실제 앱 코드가 그대로 돌아갑니다.</p>
    </header>

    <!-- 들어온 사람에게 한 번에 하나만 시킨다. 버튼 여러 개를 늘어놓으면
         무엇부터 눌러야 할지 몰라 아무것도 안 누르고 나간다. -->
    <div class="guide">
      <p class="step"><b id="stepNo">1단계</b> <span id="stepText"></span></p>
      <button id="go" type="button"></button>
      <button id="reset" type="button" class="ghost">처음부터</button>
      <a class="ghost back" href="../">기지개햄 소개</a>
      <span class="auto" id="autoTag" hidden>자동으로 보여주는 중 · 아무거나 누르면 직접 해볼 수 있어요</span>
      <div class="gear" id="gear" hidden></div>
    </div>

    <!-- 가짜 바탕화면. 이 안이 '사용자의 화면'이다. -->
    <div class="desk" id="desk">
      <div class="bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="spacer"></span>
        <span id="trayFace">🐹</span>
        <span class="clock" id="clock">10:24</span>
      </div>
      <div class="screen" id="screen">
        <div class="win"><i></i><i></i><i></i><i></i></div>
        <iframe id="pet" src="app/index.html" title="펫" scrolling="no"></iframe>
        <iframe id="prompt" src="app/prompt.html" title="알림" scrolling="no" hidden></iframe>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-head">
        <b>기록</b>
        <button id="closeDash" type="button" class="x">닫기</button>
      </div>
      <iframe id="dash" src="app/dashboard.html" title="기록"></iframe>
    </div>

    <footer>
      <a href="../">기지개햄 소개</a>
    </footer>

    <script src="pack.js"></script>
    <script src="bus.js"></script>
  </body>
</html>
