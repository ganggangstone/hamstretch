    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://ganggangstone.github.io/hamstretch/" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="기지개햄, 눈이 쉬어야 할 때 알려주는 맥 앱" />
    <meta property="og:description" content="잔소리하지 않고, 무시해도 되고, 대신 그 횟수를 기록합니다." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="기지개햄, 눈이 쉬어야 할 때 알려주는 맥 앱" />

    <meta name="twitter:image" content="https://ganggangstone.github.io/hamstretch/screenshots/ko/card-01.png" />
    <link rel="icon" href="src-tauri/icons/32x32.png" />
    <link rel="stylesheet" href="src/theme.css" />
    <link rel="stylesheet" href="site.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "기지개햄",
        "alternateName": "Hamstretch",
        "url": "https://ganggangstone.github.io/hamstretch/",
        "image": "https://ganggangstone.github.io/hamstretch/screenshots/ko/card-01.png",
        "description": "20분마다 쉬라고 알려주는 맥 메뉴바 앱. 무시해도 되고, 대신 그 횟수를 기록합니다.",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "macOS, Windows",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <header>
      <nav>
        <span class="brand"><canvas id="mark" width="44" height="44"></canvas> <b data-t="brand"></b></span>
        <span class="navright">
          <span class="langs">
            <button type="button" data-lang="ko">한국어</button>
            <button type="button" data-lang="en">English</button>
          </span>
          <a class="cta-sm" id="downloadTop" href="#install" data-t="ctaTop"></a>
        </span>
      </nav>
    </header>

    <main>
      <section class="hero">
        <canvas id="hero" width="200" height="320"></canvas>
        <h1 data-t="title"></h1>
        <p class="lead" data-t="lead"></p>
        <span class="oses">
          <button type="button" data-os="mac">macOS</button>
          <button type="button" data-os="win">Windows <span class="beta-badge" data-t="betaBadge"></span></button>
        </span>
        <p class="ctas">
          <a class="cta" id="demo" href="demo/?play=1" data-t="ctaDemo"></a>
          <a class="cta" id="download" href="#install" data-t="cta"></a>
        </p>
        <p class="specs" data-t="specs"></p>
        <p class="notice" id="notice" data-t="notOpen"></p>
        <p class="hint" data-t="ctaHint"></p>
        <p class="beta-note" id="betaNote" data-t="betaNote"></p>
      </section>

      <!-- 실제 앱이 도는 화면. 그림이 아니라 진짜 움직인다. -->
      <section class="preview">
        <iframe src="demo/?embed=1" title="기지개햄 미리보기" scrolling="no" loading="lazy"></iframe>
        <p class="preview-note" data-t="previewNote"></p>
      </section>

      <section class="shots"><div id="shots"></div></section>

      <section id="install" class="install">
        <h2 data-t="instTitle"></h2>
        <ol>
          <li data-t="inst1"></li>
          <li data-t="inst2"></li>
          <li data-t="inst3"></li>
        </ol>
        <!-- 경고 안내는 접어둔다. 받기도 전에 펼쳐 보이면 설치가 까다로워 보인다. -->
        <details class="warn">
          <summary data-t="warnTitle"></summary>
          <p data-t="warnBody"></p>
        </details>
      </section>

      <section class="faq">
        <h2 data-t="faqTitle"></h2>
        <div id="faq"></div>
      </section>
    </main>

    <footer>
      <p class="foot-brand"><b data-t="brand"></b></p>
      <p class="foot-note" data-t="footNote"></p>
      <p class="foot-links"><a id="feedback" href="#" data-t="footFeedback"></a></p>
      <p class="foot-copy">© <span id="year"></span> ganggangstone</p>
    </footer>

    <script type="module" src="site.js"></script>
  </body>
</html>
